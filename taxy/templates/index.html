<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxy - Natural Language Tax Scenarios</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .scenarios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .scenario-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .scenario-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .scenario-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .scenario-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }

        .scenario-id {
            font-size: 0.8em;
            color: #999;
            font-family: monospace;
        }

        .scenario-description {
            margin-bottom: 15px;
        }

        .scenario-description textarea {
            width: 100%;
            min-height: 80px;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
        }

        .scenario-description textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .scenario-inputs {
            margin-bottom: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .input-item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            margin-bottom: 5px;
            background: #f8f9fa;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .input-label {
            color: #666;
            font-weight: 500;
        }

        .input-value {
            color: #333;
            font-weight: bold;
        }

        .scenario-results {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 0.95em;
        }

        .result-label {
            color: #666;
        }

        .result-value {
            color: #667eea;
            font-weight: bold;
        }

        .scenario-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .add-scenario-btn {
            background: white;
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #667eea;
            font-size: 1.1em;
            font-weight: 500;
        }

        .add-scenario-btn:hover {
            background: #f8f9ff;
            border-color: #5568d3;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .error {
            color: #dc3545;
            font-size: 0.9em;
            margin-top: 10px;
            padding: 10px;
            background: #fff5f5;
            border-radius: 4px;
            border-left: 3px solid #dc3545;
        }

        .success {
            color: #28a745;
            font-size: 0.9em;
            margin-top: 10px;
            padding: 10px;
            background: #f0fff4;
            border-radius: 4px;
            border-left: 3px solid #28a745;
        }

        .empty-state {
            text-align: center;
            color: white;
            padding: 60px 20px;
        }

        .empty-state h2 {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Taxy - Tax Scenario Manager</h1>
        
        <div class="scenarios-grid" id="scenariosGrid">
            <!-- Scenarios will be added here -->
        </div>

        <div class="add-scenario-btn" onclick="addNewScenario(); return false;">
            ➕ Add New Scenario
        </div>
    </div>

    <script>
        let scenarios = [];
        let scenarioCounter = 0;

        // Load scenarios on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadScenarios();
        });

        async function loadScenarios() {
            try {
                const response = await fetch('/api/scenarios');
                const data = await response.json();
                scenarios = data.scenarios || [];
                renderScenarios();
            } catch (error) {
                console.error('Error loading scenarios:', error);
            }
        }

        function renderScenarios() {
            const grid = document.getElementById('scenariosGrid');
            
            if (scenarios.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <h2>No scenarios yet</h2>
                        <p>Click "Add New Scenario" to create your first tax scenario</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = scenarios.map((scenario, index) => `
                <div class="scenario-card" data-scenario-id="${scenario.id}">
                    <div class="scenario-header">
                        <div>
                            <div class="scenario-title">${scenario.is_baseline ? '📊 Baseline' : `Scenario ${index + 1}`}</div>
                            <div class="scenario-id">${scenario.id.substring(0, 8)}...</div>
                        </div>
                    </div>
                    
                    <div class="scenario-description">
                        <textarea 
                            id="textarea-${scenario.id}"
                            placeholder="${scenario.is_baseline ? 'Enter baseline tax scenario (e.g., "Wage income $200K, married filing jointly, 2 dependent children")' : 'Enter modifications (e.g., "Change wage income to $150K" or "Remove schedule C income")'}"
                            onblur="saveDescription('${scenario.id}', this.value)"
                        >${scenario.description || getScenarioDescription(scenario)}</textarea>
                    </div>

                    <div class="scenario-inputs" id="inputs-${scenario.id}">
                        ${renderInputs(scenario.inputs)}
                    </div>

                    <div class="scenario-results" id="results-${scenario.id}">
                        ${scenario.results ? renderResults(scenario.results) : ''}
                    </div>

                    <div class="error" id="error-${scenario.id}" style="display: none;"></div>
                    <div class="success" id="success-${scenario.id}" style="display: none;"></div>

                    <div class="scenario-actions">
                        <button class="btn btn-primary" onclick="calculateTax('${scenario.id}')">
                            Calculate Tax
                        </button>
                        <button class="btn btn-secondary" onclick="restoreScenario('${scenario.id}')">
                            Restore
                        </button>
                        ${scenario.is_baseline ? '' : `<button class="btn btn-danger" onclick="deleteScenario('${scenario.id}')">Delete</button>`}
                    </div>
                </div>
            `).join('') + `
                <div class="add-scenario-btn" onclick="addNewScenario(); return false;">
                    ➕ Add New Scenario
                </div>
            `;
        }

        function getScenarioDescription(scenario) {
            // For baseline, try to reconstruct full description
            // For other scenarios, show empty (they're modifications of baseline)
            if (scenario.is_baseline) {
                const parts = [];
                for (const [key, value] of Object.entries(scenario.inputs)) {
                    if (key.includes('L1a')) {
                        parts.push(`Wage income $${formatNumber(value)}`);
                    } else if (key.includes('FilingStatus') || key.includes('Status')) {
                        parts.push(`Filing status: ${value}`);
                    } else if (key.includes('Dependents')) {
                        parts.push(`${value} dependents`);
                    } else if (key.includes('Schedule C') && key.includes('L31')) {
                        parts.push(`Schedule C net income $${formatNumber(value)}`);
                    } else if (key.includes('Form 8812') && (key.includes('L4') || key.includes('L4a'))) {
                        parts.push(`Qualifying children: ${value}`);
                    }
                }
                return parts.join(', ') || '';
            }
            // For non-baseline scenarios, return empty (user will enter modifications)
            return '';
        }

        function formatFieldLabel(key) {
            // Parse key format: "Form 1040 / L1a" or "Schedule C / L31"
            const parts = key.split(' / ');
            if (parts.length !== 2) return key; // Fallback if format is unexpected
            
            const form = parts[0];
            const line = parts[1];
            
            // Map form names to human-friendly labels
            const formLabels = {
                'Form 1040': 'Form 1040',
                'Schedule C': 'Schedule C',
                'Schedule E': 'Schedule E',
                'Schedule A': 'Schedule A',
                'Schedule D': 'Schedule D',
                'Form 8812': 'Form 8812',
                'Schedule SE': 'Schedule SE',
                'Form 8995': 'Form 8995',
                'Form 2210': 'Form 2210'
            };
            
            // Map line identifiers to human-friendly labels
            const lineLabels = {
                // Form 1040
                'Status': 'Filing Status',
                'FilingStatus': 'Filing Status',
                'Dependents': 'Dependents',
                'DependentsTable': 'Dependents',
                'L1a': 'Wages, Salaries, Tips',
                'L25a': 'Federal Income Tax Withheld',
                'L26': 'Estimated Tax Payments',
                'L13': 'Qualified Business Income Deduction',
                'S1_3': 'Business Income',
                'S1_5': 'Rental Income',
                'S1_15': 'Deductible Part of Self-Employment Tax',
                'S2_4': 'Self-Employment Tax',
                'A5b': 'Real Estate Taxes',
                'A8a': 'Home Mortgage Interest',
                // Schedule C
                'L31': 'Net Profit or Loss',
                // Schedule E
                'L26': 'Net Rental Income or Loss',
                '4_A': 'Rental Income (Property A)',
                '4_B': 'Rental Income (Property B)',
                '4_C': 'Rental Income (Property C)',
                '18_A': 'Depreciation (Property A)',
                '18_B': 'Depreciation (Property B)',
                '18_C': 'Depreciation (Property C)',
                '19_A': 'Other Expenses (Property A)',
                '19_B': 'Other Expenses (Property B)',
                '19_C': 'Other Expenses (Property C)',
                // Schedule A
                'L5a': 'Real Estate Taxes',
                'L8': 'Home Mortgage Interest',
                'L8a': 'Home Mortgage Interest',
                // Schedule D
                'L8h': 'Net Long-Term Capital Gain',
                'D8h': 'Net Long-Term Capital Gain',
                'L1h': 'Net Short-Term Capital Gain',
                'D1h': 'Net Short-Term Capital Gain',
                'L13': 'Capital Gain Distributions',
                'D13': 'Capital Gain Distributions',
                'D11': 'Long-Term Capital Gain',
                'D4': 'Short-Term Capital Gain',
                // Form 8812
                'L4': 'Qualifying Children Under 17',
                'L4a': 'Qualifying Children Under 17',
                // Schedule SE
                'L2': 'Net Profit or Loss',
                'L8a': 'Wages and Tips',
                'L8b': 'Unreported Tips',
                'L8c': 'Wages from Form 8919',
                // Form 8995
                'L15': 'Qualified Business Income Deduction',
                // Form 2210
                'L1': 'Total Tax',
                'L2': 'Withholding',
                'L3': 'Estimated Tax Payments',
                'L6': 'Required Annual Payment',
                'L8': 'Annualized Income Installments',
                'L19': 'Penalty Amount'
            };
            
            // Get human-friendly labels
            const formLabel = formLabels[form] || form;
            const lineLabel = lineLabels[line] || line;
            
            // Format: "Human Label (Form Name, Line)"
            return `${lineLabel} (${formLabel}, ${line})`;
        }

        function renderInputs(inputs) {
            if (!inputs || Object.keys(inputs).length === 0) {
                return '<div style="color: #999; font-style: italic;">No inputs yet</div>';
            }
            return Object.entries(inputs).map(([key, value]) => `
                <div class="input-item">
                    <span class="input-label">${formatFieldLabel(key)}</span>
                    <span class="input-value">${formatValue(value)}</span>
                </div>
            `).join('');
        }

        function renderResults(results) {
            if (!results || !results.federal) return '';
            const fed = results.federal;
            return `
                <div class="result-item">
                    <span class="result-label">AGI:</span>
                    <span class="result-value">$${formatNumber(fed.AGI || 0)}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Taxable Income:</span>
                    <span class="result-value">$${formatNumber(fed.taxable_income || 0)}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Tax:</span>
                    <span class="result-value">$${formatNumber(fed.tax || 0)}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Self Employment Tax:</span>
                    <span class="result-value">$${formatNumber(fed.self_employment_tax || 0)}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Total Tax:</span>
                    <span class="result-value">$${formatNumber(fed.total_tax || 0)}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Child Tax Credit:</span>
                    <span class="result-value">$${formatNumber(fed.child_tax_credit || 0)}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Total Payments (L33):</span>
                    <span class="result-value">$${formatNumber(fed.total_payments || 0)}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Tax Due (L37):</span>
                    <span class="result-value">$${formatNumber(fed.tax_due || 0)}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Estimated Tax Penalty (L38):</span>
                    <span class="result-value">$${formatNumber(fed.estimated_tax_penalty || 0)}</span>
                </div>
            `;
        }

        function formatValue(value) {
            if (typeof value === 'number') {
                return formatNumber(value);
            }
            return value;
        }

        function formatNumber(num) {
            return new Intl.NumberFormat('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(num);
        }

        function addNewScenario() {
            // Show prompt immediately (synchronous, blocking call - don't make this async)
            try {
                // Check if baseline exists
                const hasBaseline = scenarios.length > 0;
                
                let description = '';
                if (hasBaseline) {
                    description = prompt('Enter modifications to create a new scenario:\n\nExample: "Change wage income to $150K" or "Remove schedule C income"\n\n(Leave empty to create an exact copy of baseline)');
                    if (description === null) return; // User cancelled
                } else {
                    description = prompt('Enter baseline tax scenario in natural language:\n\nExample: "Wage income $200K, married filing jointly, 2 dependent children"');
                    if (description === null || !description.trim()) return; // User cancelled or empty
                }
                
                // Now make the async call after getting the prompt
                createScenarioAsync(description.trim(), hasBaseline);
            } catch (error) {
                console.error('Error in addNewScenario:', error);
                alert('Error: ' + error.message);
            }
        }
        
        async function createScenarioAsync(description, hasBaseline) {
            try {

                const response = await fetch('/api/scenarios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        description: description, 
                        year: 2024,
                        clone_from: hasBaseline ? scenarios[0].id : null  // Clone from baseline if it exists
                    })
                });

                const data = await response.json();
                if (data.success) {
                    await loadScenarios();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                console.error('Error creating scenario:', error);
                alert('Error creating scenario: ' + error.message);
            }
        }

        // Store description locally (don't parse until Calculate is clicked)
        async function saveDescription(scenarioId, description) {
            // Just save the description text, don't parse it
            try {
                const response = await fetch(`/api/scenarios/${scenarioId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ description: description })
                });

                const data = await response.json();
                if (!data.success) {
                    console.error('Error saving description:', data.error);
                }
            } catch (error) {
                console.error('Error saving description:', error);
            }
        }

        async function calculateTax(scenarioId) {
            const card = document.querySelector(`[data-scenario-id="${scenarioId}"]`);
            const resultsDiv = document.getElementById(`results-${scenarioId}`);
            const errorDiv = document.getElementById(`error-${scenarioId}`);
            const textarea = document.getElementById(`textarea-${scenarioId}`);
            const inputsDiv = document.getElementById(`inputs-${scenarioId}`);
            
            // Get current description from textarea
            const description = textarea ? textarea.value : '';
            
            card.classList.add('loading');
            errorDiv.style.display = 'none';

            try {
                // Save description first
                if (description) {
                    await saveDescription(scenarioId, description);
                }
                
                // Now calculate (this will parse the description)
                const response = await fetch(`/api/scenarios/${scenarioId}/calculate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ description: description })
                });

                const data = await response.json();
                if (data.success) {
                    // Store results in scenario
                    const scenario = scenarios.find(s => s.id === scenarioId);
                    if (scenario) {
                        scenario.results = data.summary;
                        // Update inputs from parsed result
                        if (data.scenario) {
                            scenario.inputs = data.scenario.inputs;
                        }
                    }
                    
                    // Update inputs display
                    if (data.scenario) {
                        inputsDiv.innerHTML = renderInputs(data.scenario.inputs);
                    }
                    
                    // Update results display
                    resultsDiv.innerHTML = renderResults(data.summary);
                } else {
                    errorDiv.textContent = 'Error: ' + data.error;
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Error: ' + error.message;
                errorDiv.style.display = 'block';
            } finally {
                card.classList.remove('loading');
            }
        }

        async function restoreScenario(scenarioId) {
            if (!confirm('Restore this scenario to its previous state?')) return;

            try {
                const response = await fetch(`/api/scenarios/${scenarioId}/restore`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history_index: -1 })
                });

                const data = await response.json();
                if (data.success) {
                    await loadScenarios();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function deleteScenario(scenarioId) {
            const scenario = scenarios.find(s => s.id === scenarioId);
            if (scenario && scenario.is_baseline) {
                alert('Cannot delete the baseline scenario. Create a new baseline first.');
                return;
            }

            if (!confirm('Delete this scenario? This cannot be undone.')) return;

            try {
                const response = await fetch(`/api/scenarios/${scenarioId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();
                if (data.success) {
                    await loadScenarios();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
